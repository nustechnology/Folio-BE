# Folio backend — production stack, run from this repo on the VPS.
#
#   cd ~/srv/folio/Folio-BE
#   docker compose -f docker-compose.prod.yml up -d --build
#
# There is deliberately no plain `docker-compose.yml`: a bare `docker compose
# up` has to fail rather than quietly start the development stack on the
# server. The frontend is a separate stack from the Folio-Web repo; the two
# meet only on shared-network, where nginx routes to each by container name.
name: folio

# API and ingestion worker are the same image with the same wiring; only the
# command differs. Without the worker, sources never leave `added` — the BullMQ
# `ingestion` queue has no consumer.
x-folio-service: &folio-service
  build:
    context: .
    target: runner
  image: folio-backend:latest
  restart: unless-stopped
  env_file:
    - .env
  environment:
    # Deployment-specific only. NODE_ENV, PORT and MULTER_TEMP_DIR come from
    # the image.
    DATABASE_URL: postgresql://${FOLIO_DB_USER}:${FOLIO_DB_PASSWORD}@folio-db:5432/${FOLIO_DB_NAME}
    REDIS_HOST: folio-redis
    REDIS_PORT: "6379"
    MINIO_ENDPOINT: shared-minio
    MINIO_PORT: "9000"
    MINIO_USE_SSL: "false"
    # enviroment.ts leaves this empty in production, which rejects every
    # browser request.
    CORS_ORIGIN: https://${FOLIO_DOMAIN}
  volumes:
    - ${FOLIO_DATA_DIR:-./data}/backend-tmp:/app/tmp
  depends_on:
    folio-db:
      condition: service_healthy
    folio-redis:
      condition: service_healthy
    folio-migrate:
      condition: service_completed_successfully

services:
  folio-backend:
    <<: *folio-service
    container_name: folio-backend
    networks:
      - shared-network    # nginx reaches it here; also its route to shared-minio
      - folio-internal    # folio-db + folio-redis

  folio-worker:
    <<: *folio-service
    container_name: folio-worker
    command: ["node", "dist/workers/ingestion.worker.js"]
    # On shared-network only because shared-minio lives there; it serves no HTTP
    # and no vhost points at it.
    networks:
      - shared-network
      - folio-internal
    # Overrides the image's HEALTHCHECK, which probes /health — an endpoint the
    # worker process does not serve.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ingestion.worker.js > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # One-shot, from the builder stage because the runtime image ships without the
  # Prisma CLI. Its own service so API and worker cannot race to apply the same
  # migrations on a cold start.
  folio-migrate:
    build:
      context: .
      target: builder
    image: folio-backend-migrate:latest
    container_name: folio-migrate
    # A job that must run to completion once, not a service — the one
    # intentional exception to the restart policy.
    restart: "no"
    command: ["yarn", "db:migrate-prod"]
    environment:
      # The builder stage has none of the runner stage's ENV.
      NODE_ENV: production
      DATABASE_URL: postgresql://${FOLIO_DB_USER}:${FOLIO_DB_PASSWORD}@folio-db:5432/${FOLIO_DB_NAME}
    networks:
      - folio-internal
    depends_on:
      folio-db:
        condition: service_healthy

  # pgvector, not stock postgres: schema.prisma declares extensions = [vector]
  # and Passage.embedding is vector(1024). Folio's own instance, so the shared
  # postgres is left completely alone.
  folio-db:
    image: pgvector/pgvector:pg16
    container_name: folio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FOLIO_DB_USER}
      POSTGRES_PASSWORD: ${FOLIO_DB_PASSWORD}
      POSTGRES_DB: ${FOLIO_DB_NAME}
    volumes:
      - ${FOLIO_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    networks:
      - folio-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FOLIO_DB_USER} -d ${FOLIO_DB_NAME}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Per-app rather than shared: BullMQ works across the whole keyspace, and
  # Redis's only isolation is numbered databases — too weak between projects.
  folio-redis:
    image: redis:7-alpine
    container_name: folio-redis
    restart: unless-stopped
    # Job state is worth keeping across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${FOLIO_DATA_DIR:-./data}/redis:/data
    networks:
      - folio-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Created and owned by the shared-services stack.
  shared-network:
    external: true
  # Private to Folio.
  folio-internal:
    driver: bridge
