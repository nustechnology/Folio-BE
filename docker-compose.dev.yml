# Local development. Named explicitly so it can never collide with the `folio`
# project that docker-compose.prod.yml brings up on the VPS.
name: folio-dev

# api and worker are the same image with the same wiring; only the published
# port and the command differ.
x-folio-service: &folio-service
  build:
    context: .
    # The Dockerfile defaults to `runner`; dev needs the source tree,
    # devDependencies and tsx watch.
    target: dev
  restart: unless-stopped
  env_file:
    - .env
  environment:
    # .env carries host-mode values; inside the network these live on their
    # compose services. Ollama is the exception — it stays on the HOST, because
    # Docker Desktop gives containers no Metal access.
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    MINIO_ENDPOINT: minio
    MINIO_PORT: 9000
    MODEL_EMBEDDING_BASE_URL: ${MODEL_EMBEDDING_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
    # Overridden rather than left to enviroment.ts, whose fallback reads the
    # host-mode MODEL_EMBEDDING_BASE_URL — and inside a container, localhost is
    # the container itself. The nested default keeps chat following embeddings.
    MODEL_CHAT_BASE_URL: ${MODEL_CHAT_BASE_URL_DOCKER:-${MODEL_EMBEDDING_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}}
  # Docker Desktop resolves this already; Linux hosts need the mapping.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    # Without this, the tsx watch in `yarn dev` watches image-baked source.
    - ./src:/app/src
    # Anonymous volume: each service generates its own Prisma client on boot,
    # so they never race writing one directory.
    - /app/src/generated
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  api:
    <<: *folio-service
    ports:
      - "${PORT:-4000}:${PORT:-4000}"

  # Consumes the BullMQ `ingestion` queue; without it sources never leave
  # `added`. `yarn dev:worker` is only tsx watch, so db:generate must run first.
  worker:
    <<: *folio-service
    command: sh -c "yarn db:generate && yarn dev:worker"

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The bucket itself is created by ensureBucket() at API boot (src/index.ts).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  redis_data:
